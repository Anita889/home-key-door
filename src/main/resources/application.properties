spring.application.name=home-key-door
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

security.token.header=Authorization
security.token.secret=secret
security.token.expiration=3600
security.refreshtoken.header=Authorization
security.refreshtoken.secret=secret
security.refreshtoken.expiration=3600

